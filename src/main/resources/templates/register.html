<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register · QuizHub</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="narrow"><div th:replace="~{fragments :: messages}"></div><section class="panel"><span class="eyebrow">JOIN QUIZHUB</span><h1>Create account</h1><form method="post" th:action="@{/register}" class="stack"><label>Username<input name="username" minlength="3" maxlength="50" pattern="[A-Za-z0-9_.-]+" required></label><label>Password<input name="password" type="password" minlength="8" required><small>At least 8 characters.</small></label><label>I am a<select name="role" required><option value="STUDENT">Student</option><option value="TEACHER">Teacher</option></select></label><button class="btn" type="submit">Create account</button></form><p class="muted">Already registered? <a href="/login">Log in</a></p></section></main></body></html>
