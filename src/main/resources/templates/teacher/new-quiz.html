<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create quiz · QuizHub</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div th:replace="~{fragments :: nav}"></div>

    <main class="page narrow-wide">
      <div th:replace="~{fragments :: messages}"></div>

      <a class="back" href="/teacher">← Back to dashboard</a>
      <span class="eyebrow">QUIZ BUILDER</span>
      <h1>Create a quiz</h1>
      <p>Add between 1 and 10 questions. Your quiz will be saved as a draft.</p>

      <form
        id="quiz-form"
        method="post"
        th:action="@{/teacher/quizzes}"
        class="stack"
      >
        <section class="panel">
          <label
            >Quiz title
            <input name="title" maxlength="100" required />
          </label>

          <label
            >Subject
            <input
              name="subject"
              maxlength="50"
              placeholder="e.g. Biology"
              required
            />
          </label>

          <label
            >Description
            <textarea name="description" rows="3" required></textarea>
          </label>
        </section>

        <!-- JavaScript inserts the question cards here -->
        <div id="question-list"></div>

        <!-- Template for every new question -->
        <template id="question-template">
          <fieldset class="question-block">
            <legend>Question __INDEX__</legend>

            <label
              >Question text
              <textarea name="q__INDEX__" required rows="2"></textarea>
            </label>

            <div class="options">
              <label
                >Option A
                <input name="a__INDEX__" maxlength="255" required />
              </label>
              <label
                >Option B
                <input name="b__INDEX__" maxlength="255" required />
              </label>
              <label
                >Option C
                <input name="c__INDEX__" maxlength="255" required />
              </label>
              <label
                >Option D
                <input name="d__INDEX__" maxlength="255" required />
              </label>
            </div>

            <label
              >Correct answer
              <select name="correct__INDEX__" required>
                <option value="">Choose answer</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
              </select>
            </label>

            <label
              >Explanation
              <textarea
                name="explanation__INDEX__"
                required
                rows="2"
                placeholder="Explain why the answer is correct"
              ></textarea>
            </label>

            <button type="button" class="btn remove-question">
              Remove question
            </button>
          </fieldset>
        </template>

        <section class="panel">
          <div class="form-footer">
            <span id="question-count" class="muted"> 1 of 10 questions </span>

            <button type="button" id="add-question" class="btn">
              + Add question
            </button>
          </div>
        </section>

        <!-- Server validates this value; it is not trusted on its own -->
        <input
          type="hidden"
          id="questionCount"
          name="questionCount"
          value="1"
        />

        <div class="form-footer">
          <span class="muted">Maximum: 10 questions</span>
          <button class="btn" type="submit">Save draft</button>
        </div>
      </form>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const MAX_QUESTIONS = 10;

        const questionList = document.getElementById("question-list");
        const questionTemplate = document.getElementById("question-template");
        const addButton = document.getElementById("add-question");
        const questionCountInput = document.getElementById("questionCount");
        const questionCountLabel = document.getElementById("question-count");
        const form = document.getElementById("quiz-form");

        function renumberQuestions() {
          const cards = questionList.querySelectorAll(".question-block");

          cards.forEach((card, index) => {
            const number = index + 1;
            card.querySelector("legend").textContent = `Question ${number}`;

            // Keep names sequential after a question is removed.
            card.querySelectorAll("[name]").forEach((field) => {
              field.name = field.name.replace(
                /^(q|a|b|c|d|correct|explanation)\d+$/,
                `$1${number}`,
              );
            });

            const removeButton = card.querySelector(".remove-question");
            removeButton.disabled = cards.length === 1;
          });

          const count = cards.length;
          questionCountInput.value = count;
          questionCountLabel.textContent = `${count} of ${MAX_QUESTIONS} questions`;
          addButton.disabled = count >= MAX_QUESTIONS;
        }

        function addQuestion() {
          const count = questionList.querySelectorAll(".question-block").length;

          if (count >= MAX_QUESTIONS) {
            return;
          }

          const nextNumber = count + 1;
          const html = questionTemplate.innerHTML.replaceAll(
            "__INDEX__",
            String(nextNumber),
          );

          questionList.insertAdjacentHTML("beforeend", html);
          renumberQuestions();
        }

        addButton.addEventListener("click", addQuestion);

        questionList.addEventListener("click", (event) => {
          const removeButton = event.target.closest(".remove-question");

          if (!removeButton) {
            return;
          }

          const cards = questionList.querySelectorAll(".question-block");

          if (cards.length > 1) {
            removeButton.closest(".question-block").remove();
            renumberQuestions();
          }
        });

        form.addEventListener("submit", (event) => {
          renumberQuestions();

          const count = questionList.querySelectorAll(".question-block").length;

          if (count < 1 || count > MAX_QUESTIONS) {
            event.preventDefault();
            alert("A quiz must contain between 1 and 10 questions.");
          }
        });

        // Start with exactly one question card.
        addQuestion();
      });
    </script>
  </body>
</html>
