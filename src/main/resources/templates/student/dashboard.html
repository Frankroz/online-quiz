<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Find quizzes · QuizHub</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div th:replace="~{fragments :: nav}"></div>
    <main class="page">
      <div th:replace="~{fragments :: messages}"></div>
      <div class="pagehead">
        <div>
          <span class="eyebrow">STUDENT SPACE</span>
          <h1>Find your next challenge</h1>
          <p>Search by subject and test what you know.</p>
        </div>
      </div>
      <form method="get" action="/student" class="searchbar">
        <input
          name="subject"
          th:value="${subject}"
          placeholder="Search subjects, e.g. Biology"
        /><button class="btn" type="submit">Search</button
        ><a class="btn secondary" href="/student">Clear</a>
      </form>
      <div th:if="${#lists.isEmpty(quizzes)}" class="empty">
        <h3>No quizzes found</h3>
        <p>Try a different subject, or check back later.</p>
      </div>
      <div class="quiz-grid">
        <article class="quiz-card" th:each="q : ${quizzes}">
          <span class="tag" th:text="${q.subject}"></span>
          <h3 th:text="${q.title}"></h3>
          <p th:text="${q.description}"></p>
          <p class="muted">
            Created by
            <strong th:text="${q.teacher.username}">Teacher</strong>
          </p>

          <p class="muted">
            Attempts used:
            <strong th:text="${attemptsUsed[q.id] ?: 0}">0</strong>
            / 3
          </p>

          <a
            class="btn small"
            th:if="${attemptsUsed[q.id] == null or attemptsUsed[q.id] < 3}"
            th:href="@{/student/quizzes/{id}(id=${q.id})}"
          >
            View and start →
          </a>

          <span
            class="btn small secondary"
            th:if="${attemptsUsed[q.id] != null and attemptsUsed[q.id] >= 3}"
          >
            Maximum attempts reached
          </span>
        </article>
      </div>
      <p class="muted footerlink">
        <a href="/student/history">View your previous results →</a>
      </p>
    </main>
  </body>
</html>
