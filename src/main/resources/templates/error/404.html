<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Page not found · QuizHub</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <main class="page" style="text-align: center; padding-top: 10vh">
      <span class="eyebrow">ERROR 404</span>

      <h1 style="font-size: clamp(3rem, 10vw, 7rem)">Lost your way?</h1>

      <h2>Page not found</h2>

      <p class="muted">
        The page you're looking for doesn't exist, may have moved, or the URL
        may be incorrect.
      </p>

      <div style="margin-top: 2rem">
        <a class="btn" href="/">Go home</a>
        <a class="btn secondary" href="/student">Find quizzes</a>
      </div>
    </main>
  </body>
</html>
