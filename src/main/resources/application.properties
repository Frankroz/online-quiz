spring.application.name=online-quiz

server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quiz_app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:quiz_app_user}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.thymeleaf.cache=false

server.error.include-message=never